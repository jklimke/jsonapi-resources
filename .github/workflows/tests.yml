name: CI

on:
  push:
    branches: [ 'master', 'release-0-8', 'release-0-9', 'release-0-10', 'rails-8.1-compat' ]
  pull_request:
    branches: ['**']

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
        rails:
          - '7.1'
          - '7.2'
          - '8.0'
          - '8.1'
        exclude:
          # Pair the older Rails lines with the Ruby versions they target; the
          # sqlite3 1.4.x line used for Rails < 8 does not build on Ruby 3.4+.
          - ruby: '3.4'
            rails: '7.1'
          - ruby: '3.4'
            rails: '7.2'
          - ruby: '4.0'
            rails: '7.1'
          - ruby: '4.0'
            rails: '7.2'
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    name: Ruby ${{ matrix.ruby }} Rails ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
